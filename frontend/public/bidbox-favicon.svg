<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#070A12"/>
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#2A3B66" stroke-width="1.5"/>

  <!-- Glowing Aura -->
  <circle cx="32" cy="32" r="18" fill="#8B5CF6" opacity="0.25" filter="url(#glow)"/>

  <!-- 3D Isometric BidBox Cube -->
  <g transform="translate(32, 33)">
    <!-- Top Face -->
    <polygon points="0,-16 16,-8 0,0 -16,-8" fill="url(#topFace)"/>
    
    <!-- Left Face -->
    <polygon points="-16,-8 0,0 0,16 -16,8" fill="url(#leftFace)"/>
    
    <!-- Right Face -->
    <polygon points="0,0 16,-8 16,8 0,16" fill="url(#rightFace)"/>

    <!-- Subtle Inner Highlight Edges -->
    <polyline points="-16,-8 0,0 16,-8" fill="none" stroke="#E0E7FF" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="16" stroke="#93C5FD" stroke-width="1" opacity="0.7"/>

    <!-- Glowing Cyan Bid Dot (Auction Active) -->
    <circle cx="12" cy="-12" r="3.5" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="12" cy="-12" r="2" fill="#FFFFFF"/>
  </g>
</svg>
