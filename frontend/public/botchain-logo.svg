<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="botchainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon Frame -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           stroke="url(#botchainGrad)" 
           stroke-width="3" 
           fill="#0B0F19" 
           fill-opacity="0.9" />

  <!-- Inner Circuit Grid Accent -->
  <polygon points="50,16 80,33 80,67 50,84 20,67 20,33" 
           stroke="url(#botchainGrad)" 
           stroke-width="1.2" 
           stroke-dasharray="3,3"
           fill="none" 
           opacity="0.4" />

  <!-- Robot / AI Blockchain Core Node -->
  <circle cx="50" cy="50" r="14" fill="url(#botchainGrad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="8" fill="#0A0E1A" />
  <circle cx="50" cy="50" r="4" fill="#06B6D4" />

  <!-- Connection Nodes -->
  <circle cx="50" cy="16" r="3" fill="#06B6D4" />
  <circle cx="80" cy="33" r="3" fill="#6366F1" />
  <circle cx="80" cy="67" r="3" fill="#A855F7" />
  <circle cx="50" cy="84" r="3" fill="#EC4899" />
  <circle cx="20" cy="67" r="3" fill="#8B5CF6" />
  <circle cx="20" cy="33" r="3" fill="#06B6D4" />

  <!-- Connecting Bus Lines -->
  <line x1="50" y1="16" x2="50" y2="36" stroke="#06B6D4" stroke-width="2" opacity="0.8" />
  <line x1="80" y1="33" x2="62" y2="44" stroke="#6366F1" stroke-width="2" opacity="0.8" />
  <line x1="80" y1="67" x2="62" y2="56" stroke="#A855F7" stroke-width="2" opacity="0.8" />
  <line x1="50" y1="84" x2="50" y2="64" stroke="#EC4899" stroke-width="2" opacity="0.8" />
  <line x1="20" y1="67" x2="38" y2="56" stroke="#8B5CF6" stroke-width="2" opacity="0.8" />
  <line x1="20" y1="33" x2="38" y2="44" stroke="#06B6D4" stroke-width="2" opacity="0.8" />
</svg>
